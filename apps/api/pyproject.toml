[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2",
  "cryptography>=50.0.1,<51",
  "psycopg[binary]>=3.2,<4", "argon2-cffi>=25.1,<26",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2.14,<3", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
include = ["nexus_api*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
